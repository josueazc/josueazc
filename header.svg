<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <clipPath id="rounded">
      <rect width="1200" height="300" rx="20" ry="20"/>
    </clipPath>
    <pattern id="checker" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="#111111"/>
      <rect width="30" height="30" fill="#1a1a1a"/>
      <rect x="30" y="30" width="30" height="30" fill="#1a1a1a"/>
    </pattern>
    <!-- Diagonal stripe overlay for flannel effect -->
    <pattern id="stripes" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="transparent"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#ffffff" stroke-width="0.4" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Background -->
  <g clip-path="url(#rounded)">
    <rect width="1200" height="300" fill="url(#checker)"/>
    <rect width="1200" height="300" fill="url(#stripes)"/>

    <!-- Left accent line -->
    <rect x="0" y="0" width="4" height="300" fill="#333"/>

    <!-- Text: username -->
    <text
      x="72"
      y="148"
      font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
      font-size="62"
      font-weight="700"
      fill="#ffffff"
      letter-spacing="-1"
    >josueazc</text>

    <!-- Text: subtitle -->
    <text
      x="74"
      y="196"
      font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
      font-size="28"
      font-weight="400"
      fill="#888888"
      letter-spacing="0.5"
    >Fullstack Developer</text>

    <!-- GitHub Octocat SVG (simplified) -->
    <g transform="translate(1020, 60) scale(3.6)">
      <path fill="#ffffff" fill-opacity="0.9" d="M32 0C14.327 0 0 14.327 0 32c0 14.136 9.173 26.135 21.898 30.371 1.6.296 2.186-.694 2.186-1.543 0-.76-.028-2.77-.043-5.437-8.901 1.935-10.782-4.292-10.782-4.292-1.456-3.696-3.553-4.68-3.553-4.68-2.904-1.986.22-1.946.22-1.946 3.21.226 4.9 3.296 4.9 3.296 2.852 4.888 7.484 3.476 9.306 2.658.29-2.068 1.116-3.476 2.03-4.274-7.107-.808-14.578-3.553-14.578-15.81 0-3.492 1.247-6.349 3.295-8.588-.331-.808-1.428-4.064.313-8.473 0 0 2.686-.861 8.8 3.28 2.552-.71 5.292-1.065 8.012-1.077 2.72.012 5.46.367 8.016 1.077 6.107-4.141 8.793-3.28 8.793-3.28 1.74 4.409.644 7.665.314 8.473 2.053 2.239 3.29 5.096 3.29 8.588 0 12.286-7.484 14.995-14.61 15.788 1.148 .99 2.172 2.944 2.172 5.934 0 4.283-.04 7.737-.04 8.793 0 .856.576 1.854 2.196 1.54C54.836 58.127 64 46.132 64 32 64 14.327 49.673 0 32 0z"/>
    </g>
  </g>

  <!-- Border -->
  <rect width="1200" height="300" rx="20" ry="20" fill="none" stroke="#2d2d2d" stroke-width="2"/>
</svg>
